name: watch

on:
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check saved alerts
        run: |
          end=$((SECONDS + 270))
          while [ "$SECONDS" -lt "$end" ]; do
            curl -fsS --max-time 50 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://pharos-desk.vercel.app/api/watch || true
            sleep 20
          done
